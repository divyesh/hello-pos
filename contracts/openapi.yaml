openapi: 3.0.3
info:
  title: Hello POS API
  version: 0.1.0
  description: >
    API shared by the Hello POS web back office and Android app.
    Money is always sent as int64 minor units with an ISO 4217 currency code.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:5080
    description: Local development
security:
  - ownerSession: []
tags:
  - name: System
    description: Service status
  - name: Business
    description: The business open in this session
  - name: Staff
    description: People who work at the open business, roles and invitations
  - name: Devices
    description: POS devices of the open business
  - name: Pos
    description: Calls made by the Android POS app
  - name: Owner
    description: Owner accounts and sessions (web back office)
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Service status
      description: >
        Anonymous. Returns the service's own status and version only; no configuration,
        secrets, or internal details.
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                service: hello-pos-api
                version: 0.1.0-dev
                status: available
                serverTimeUtc: '2026-10-10T14:03:22Z'
        default:
          description: Unexpected error, as RFC 7807 problem details.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /owner/sign-up:
    post:
      tags: [Owner]
      operationId: ownerSignUp
      summary: Create an owner account
      description: >
        Anonymous. Always answers 202 for a well-formed request, whether or not the email is already
        registered (no account enumeration); the address receives either a verification link or an
        "already registered" notice. Rate limited per client address.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '202':
          description: Accepted. Check the email inbox.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /owner/verify-email:
    post:
      tags: [Owner]
      operationId: ownerVerifyEmail
      summary: Confirm an email address from the verification link
      description: The link works once, for 24 hours.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerTokenRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          $ref: '#/components/responses/InvalidLink'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
  /owner/resend-verification:
    post:
      tags: [Owner]
      operationId: ownerResendVerification
      summary: Send a new verification link
      description: Always 202; a link is sent only to an existing, unverified account.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /owner/sign-in:
    post:
      tags: [Owner]
      operationId: ownerSignIn
      summary: Sign in and start a session
      description: >
        Sets the HttpOnly session cookie. Every failure (unknown email, wrong password, locked
        account) gets the same 401. Five failures lock the account for 15 minutes.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '204':
          description: Signed in; the response sets the session cookie.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: Email or password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: >
            The password is correct but the email is not verified yet (type
            urn:hellopos:problem:verification-required), or the client header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /owner/sign-out:
    post:
      tags: [Owner]
      operationId: ownerSignOut
      summary: End the session
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204':
          description: Signed out; the session cookie is removed.
        '403':
          $ref: '#/components/responses/MissingClientHeader'
  /owner/forgot-password:
    post:
      tags: [Owner]
      operationId: ownerForgotPassword
      summary: Send a password reset link
      description: Always 202; a link is sent only to an existing account.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /owner/reset-password:
    post:
      tags: [Owner]
      operationId: ownerResetPassword
      summary: Set a new password from the reset link
      description: The link works once, for 1 hour. Ends every existing session of the account.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          description: Invalid, used or expired link, or the new password breaks the rules.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /owner/me:
    get:
      tags: [Owner]
      operationId: ownerMe
      summary: The signed-in owner
      responses:
        '200':
          description: The signed-in owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '401':
          $ref: '#/components/responses/NotSignedIn'
  /owner/businesses:
    get:
      tags: [Owner]
      operationId: ownerListBusinesses
      summary: The businesses the signed-in owner owns
      responses:
        '200':
          description: The owner's businesses, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessSummary'
        '401':
          $ref: '#/components/responses/NotSignedIn'
    post:
      tags: [Owner]
      operationId: ownerCreateBusiness
      summary: Create a business owned by the signed-in owner
      description: >
        The server chooses the business id. Needs a verified email. Settings are validated with
        the same rules the web form uses; nothing is stored when any field is invalid.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessSettings'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          description: Email not verified, or the client header is missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /owner/businesses/{businessId}/open:
    post:
      tags: [Owner]
      operationId: ownerOpenBusiness
      summary: Open one of the owner's businesses in this session
      description: >
        The session then acts for this business only. A business the owner does not own answers
        404, exactly like one that does not exist. Opening another business switches.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Opened; the response renews the session cookie.
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '404':
          description: Not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /business:
    get:
      tags: [Business]
      operationId: getCurrentBusiness
      summary: Settings of the business open in this session
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
      responses:
        '200':
          description: The open business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '409':
          $ref: '#/components/responses/BusinessChanged'
    put:
      tags: [Business]
      operationId: updateCurrentBusiness
      summary: Change the settings of the business open in this session
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessSettings'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '409':
          $ref: '#/components/responses/BusinessChanged'
  /staff:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: People who work at the open business
      description: Owners and managers. Never includes PINs.
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
      responses:
        '200':
          description: Staff, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/BusinessChanged'
    post:
      tags: [Staff]
      operationId: addStaff
      summary: Add a person who signs in on the POS with a username and PIN
      description: >
        Owners add cashiers and managers; managers add cashiers. Owners join by invitation only.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffMember'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/BusinessChanged'
  /staff/{staffId}:
    get:
      tags: [Staff]
      operationId: getStaff
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The staff member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessChanged'
    put:
      tags: [Staff]
      operationId: updateStaff
      summary: Rename a person or change their role
      description: >
        Owners change any role (an owner needs a back-office account); managers rename cashiers only. A stale version, or removing the last active owner, is 409.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaffConflict'
  /staff/{staffId}/deactivate:
    post:
      tags: [Staff]
      operationId: deactivateStaff
      summary: Deactivate a person (they can no longer sign in)
      description: >
        Staff are never deleted. Managers deactivate cashiers only; the last active owner cannot be deactivated.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffVersion'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaffConflict'
  /staff/{staffId}/reactivate:
    post:
      tags: [Staff]
      operationId: reactivateStaff
      summary: Reactivate a person
      description: >
        Managers reactivate cashiers only.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffVersion'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaffConflict'
  /staff/{staffId}/pin:
    put:
      tags: [Staff]
      operationId: setStaffPin
      summary: Set or reset a person's POS username and PIN
      description: >
        Owners for anyone, managers for cashiers. The PIN is never returned.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPin'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaffConflict'
  /staff/invitations:
    get:
      tags: [Staff]
      operationId: listInvitations
      summary: Invitations of the open business (owners)
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
      responses:
        '200':
          description: Pending invitations first, then the most recent others.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/BusinessChanged'
    post:
      tags: [Staff]
      operationId: inviteStaff
      summary: Invite someone by email as owner or manager (owners)
      description: >
        Emails a single-use link valid for 7 days. The answer is the same whether or not the address
        already has an account.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInvitation'
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          description: Already invited (pending), already a member, or another business is open now.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /staff/invitations/{invitationId}/revoke:
    post:
      tags: [Staff]
      operationId: revokeInvitation
      summary: Revoke a pending invitation (owners)
      description: >
        Its link stops working at once. Only pending invitations can be revoked.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessChanged'
  /staff/invitations/{invitationId}/resend:
    post:
      tags: [Staff]
      operationId: resendInvitation
      summary: Send a pending or expired invitation again (owners)
      description: >
        Issues a new link valid for 7 days; the previous link stops working.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessChanged'
  /invitations/preview:
    post:
      tags: [Staff]
      operationId: previewInvitation
      summary: What an invitation link offers
      description: Anonymous. Unknown, used, revoked and expired links all answer 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/accept:
    post:
      tags: [Staff]
      operationId: acceptInvitation
      summary: Accept an invitation with the signed-in account
      description: >
        The account's verified email must be the invited one; otherwise the answer is the same 404 as
        an unknown link.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '204':
          description: Accepted; the business is now in the account's list.
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/MissingClientHeader'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The account already works at this business (already-member).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: POS devices of the open business (owners and managers)
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
      responses:
        '200':
          description: Devices, active first, then by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/BusinessChanged'
  /devices/pairings:
    post:
      tags: [Devices]
      operationId: createDevicePairing
      summary: A one-time code to connect a device to the open business
      description: 8 characters shown as ABCD-EFGH, valid for 5 minutes, usable once.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
      responses:
        '201':
          description: The code. It is shown only now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePairing'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/BusinessChanged'
  /devices/{deviceId}:
    get:
      tags: [Devices]
      operationId: getDevice
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessChanged'
    put:
      tags: [Devices]
      operationId: renameDevice
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRename'
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceConflict'
  /devices/{deviceId}/revoke:
    post:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoke a device; everyone signed in on it is signed out
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceVersion'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceConflict'
  /pos/device:
    get:
      tags: [Pos]
      operationId: posDevice
      summary: This device's registration (the app checks it at start)
      security:
        - deviceCredential: []
      responses:
        '200':
          description: Registered and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosDeviceInfo'
        '401':
          description: Unknown or revoked device; the app asks to register again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pos/pair:
    post:
      tags: [Pos]
      operationId: posPair
      summary: Connect this device to a business with a one-time code
      description: >
        Anonymous and rate limited. The business is the one the code was issued for. Answers the device
        credential once; the device must keep it in secure storage.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosPairRequest'
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosPairResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          description: The code is unknown, used or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /pos/sign-in:
    post:
      tags: [Pos]
      operationId: posSignIn
      summary: Sign a person in on this device with POS username and PIN
      description: >
        Every failure (unknown username, wrong PIN, inactive or locked person, another business's
        username) gets the same 401. Five failures lock the person for 15 minutes on every device; repeated
        failures on one device make it wait (429 with Retry-After).
      security:
        - deviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosSignInRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSignInResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: Username or PIN is incorrect (also for an unknown or revoked device).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many attempts on this device or from this address; wait for Retry-After seconds.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pos/refresh:
    post:
      tags: [Pos]
      operationId: posRefresh
      summary: New tokens for a session (the refresh token is replaced every time)
      description: Presenting a refresh token that was already replaced ends the session.
      security:
        - deviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosRefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTokens'
        '401':
          description: The session has ended; sign in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /pos/sign-out:
    post:
      tags: [Pos]
      operationId: posSignOut
      summary: End this session
      security:
        - staffSession: []
      responses:
        '204':
          description: Signed out.
        '401':
          description: No session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pos/me:
    get:
      tags: [Pos]
      operationId: posMe
      summary: The signed-in person
      security:
        - staffSession: []
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosStaff'
        '401':
          description: No session, or it has ended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pos/me/pin:
    put:
      tags: [Pos]
      operationId: posChangeOwnPin
      summary: Change one's own PIN
      description: >
        Needs the current PIN; a wrong one counts as a failed sign-in (lockout). On success the person's
        other sessions end and this session continues with the new tokens returned.
      security:
        - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosChangePin'
      responses:
        '200':
          description: Changed; use these tokens from now on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTokens'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: No session, or it has ended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pos/offline-access:
    get:
      tags: [Pos]
      operationId: posOfflineAccess
      summary: The data this device needs to check PINs offline
      description: >
        The active staff of this business who have a PIN (username, name, role, PIN hash, when the PIN
        changed), encrypted so only this device can read it. Fetch every 15 minutes while online.
      security:
        - deviceCredential: []
      responses:
        '200':
          description: The encrypted bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosOfflineAccess'
        '401':
          description: The device is not registered or was revoked.
  /pos/sessions/offline:
    post:
      tags: [Pos]
      operationId: posSessionFromOffline
      summary: Turn an offline sign-in into a session
      description: >
        Accepted only when the person is still active and their PIN has not changed since the value
        the device checked against; otherwise 401 and the device signs the person out.
      security:
        - deviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosOfflineSession'
      responses:
        '200':
          description: The session for the offline sign-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTokens'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: Not accepted; sign the person out.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /pos/attempts:
    post:
      tags: [Pos]
      operationId: posReportAttempts
      summary: Report PIN attempts made offline
      description: Failures count toward the person's lockout as if they had happened online.
      security:
        - deviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosAttemptReport'
      responses:
        '204':
          description: Recorded.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          description: The device is not registered or was revoked.
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [service, version, status, serverTimeUtc]
      properties:
        service:
          type: string
          description: Service name.
          example: hello-pos-api
        version:
          type: string
          description: Build version of the running service.
          example: 0.1.0-dev
        status:
          type: string
          enum: [available, degraded]
        serverTimeUtc:
          type: string
          format: date-time
          description: Current server time in UTC (ISO 8601, ending in Z).
    ProblemDetails:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          description: Correlation id for this request (Constitution, Principle IX).
    ValidationProblemDetails:
      type: object
      description: RFC 7807 problem details with the message for each invalid field.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: object
          description: Field name (camelCase) to messages.
          additionalProperties:
            type: array
            items:
              type: string
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          description: The owner's name, 1 to 100 characters.
          example: Asha Patel
        email:
          type: string
          example: asha@example.com
        password:
          type: string
          description: At least 12 and at most 128 characters; very common passwords are refused.
    OwnerTokenRequest:
      type: object
      additionalProperties: false
      required: [ownerId, token]
      properties:
        ownerId:
          type: string
          format: uuid
        token:
          type: string
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [ownerId, token, newPassword]
      properties:
        ownerId:
          type: string
          format: uuid
        token:
          type: string
        newPassword:
          type: string
    OwnerProfile:
      type: object
      additionalProperties: false
      required: [ownerId, displayName, email, emailVerified]
      properties:
        ownerId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        currentBusinessId:
          type: string
          format: uuid
          description: The business opened in this session; absent when none is open.
        currentRole:
          type: string
          enum: [owner, manager]
          description: >
            The account's role in the open business; absent when none is open or the account is no
            longer active staff there.
    BusinessSettings:
      type: object
      additionalProperties: false
      required: [name, countryCode, currencyCode, pricingMode, financialYearStartMonth, timeZone, cashRoundingStepMinor]
      properties:
        name:
          type: string
          description: 1 to 200 characters.
          example: Patel Grocers
        countryCode:
          type: string
          enum: [IN, US, CA]
        currencyCode:
          type: string
          description: ISO 4217, three capital letters.
          example: INR
        pricingMode:
          type: string
          enum: [tax_inclusive, tax_exclusive]
        financialYearStartMonth:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        timeZone:
          type: string
          description: IANA time zone in the chosen country.
          example: Asia/Kolkata
        cashRoundingStepMinor:
          type: integer
          format: int64
          description: Cash rounding step in minor units (paise, cents); 0 (none), 5, 10 or 100.
          enum: [0, 5, 10, 100]
    Business:
      type: object
      additionalProperties: false
      required: [id, name, countryCode, currencyCode, pricingMode, financialYearStartMonth, timeZone, cashRoundingStepMinor, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        countryCode:
          type: string
          enum: [IN, US, CA]
        currencyCode:
          type: string
        pricingMode:
          type: string
          enum: [tax_inclusive, tax_exclusive]
        financialYearStartMonth:
          type: integer
          format: int32
        timeZone:
          type: string
        cashRoundingStepMinor:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BusinessSummary:
      type: object
      additionalProperties: false
      required: [id, name, countryCode, currencyCode, role]
      properties:
        role:
          type: string
          enum: [owner, manager]
          description: The signed-in account's role in this business.
        id:
          type: string
          format: uuid
        name:
          type: string
        countryCode:
          type: string
          enum: [IN, US, CA]
        currencyCode:
          type: string
    StaffMember:
      type: object
      additionalProperties: false
      required: [id, displayName, role, active, hasPin, hasBackOfficeAccess, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier]
        active:
          type: boolean
        posUsername:
          type: string
          description: POS sign-in name; absent when the person does not use the POS.
        hasPin:
          type: boolean
        hasBackOfficeAccess:
          type: boolean
          description: Linked to a back-office account (owners and invited managers).
        version:
          type: integer
          format: int32
          description: Send back when changing this person; a stale value is refused (staff-changed).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewStaffMember:
      type: object
      additionalProperties: false
      required: [displayName, role, posUsername, pin]
      properties:
        displayName:
          type: string
          description: 1 to 100 characters.
        role:
          type: string
          enum: [manager, cashier]
        posUsername:
          type: string
          description: 3 to 32 letters, digits, dots, dashes or underscores; unique in the business.
        pin:
          type: string
          description: 4 to 6 digits, not one repeated digit and not a run like 1234.
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, displayName, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, manager]
        displayName:
          type: string
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NewInvitation:
      type: object
      additionalProperties: false
      required: [email, role, displayName]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [owner, manager]
        displayName:
          type: string
    InvitationToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [businessName, role, displayName]
      properties:
        businessName:
          type: string
        role:
          type: string
          enum: [owner, manager]
        displayName:
          type: string
    StaffUpdate:
      type: object
      additionalProperties: false
      required: [displayName, role, version]
      properties:
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier]
        version:
          type: integer
          format: int32
    StaffVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int32
    StaffPin:
      type: object
      additionalProperties: false
      required: [posUsername, pin, version]
      properties:
        posUsername:
          type: string
        pin:
          type: string
        version:
          type: integer
          format: int32
    Device:
      type: object
      additionalProperties: false
      required: [id, name, registeredBy, registeredAt, active, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        registeredBy:
          type: string
          description: Name of the person who registered it.
        registeredAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        active:
          type: boolean
        version:
          type: integer
          format: int32
    DevicePairing:
      type: object
      additionalProperties: false
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: ABCD-EFGH (no 0, O, 1, I or L).
        expiresAt:
          type: string
          format: date-time
    DeviceRename:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int32
    DeviceVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int32
    PosDeviceInfo:
      type: object
      additionalProperties: false
      required: [deviceId, deviceName, businessId, businessName]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
    PosPairRequest:
      type: object
      additionalProperties: false
      required: [code, deviceName, publicKey]
      properties:
        code:
          type: string
        deviceName:
          type: string
          description: 1 to 60 characters, for example Front till.
        publicKey:
          type: string
          description: The device's RSA public key (X.509 SubjectPublicKeyInfo, base64), at least 2048 bits.
    PosPairResult:
      type: object
      additionalProperties: false
      required: [deviceId, deviceCredential, businessId, businessName]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceCredential:
          type: string
          description: 'Sent as "Authorization: Device <credential>". Shown only in this response.'
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
    PosSignInRequest:
      type: object
      additionalProperties: false
      required: [username, pin]
      properties:
        username:
          type: string
        pin:
          type: string
    PosRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    PosTokens:
      type: object
      additionalProperties: false
      required: [accessToken, accessExpiresAt, refreshToken, sessionExpiresAt]
      properties:
        accessToken:
          type: string
          description: 'Sent as "Authorization: Bearer <token>"; valid 15 minutes.'
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Replaced on every refresh; keep only the newest.
        sessionExpiresAt:
          type: string
          format: date-time
          description: The session ends at this time at the latest (12 hours after sign-in).
    PosStaff:
      type: object
      additionalProperties: false
      required: [staffId, displayName, role, businessId, businessName]
      properties:
        staffId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier]
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
    PosSignInResult:
      type: object
      additionalProperties: false
      required: [tokens, staff]
      properties:
        tokens:
          $ref: '#/components/schemas/PosTokens'
        staff:
          $ref: '#/components/schemas/PosStaff'
    PosChangePin:
      type: object
      additionalProperties: false
      required: [currentPin, newPin]
      properties:
        currentPin:
          type: string
        newPin:
          type: string
          description: 4 to 6 digits, not a simple pattern.
    PosOfflineAccess:
      type: object
      additionalProperties: false
      required: [version, generatedAt, bundle]
      properties:
        version:
          type: string
          description: Changes whenever the contents change.
        generatedAt:
          type: string
          format: date-time
        bundle:
          type: string
          description: >
            Base64 (plain string, so every client reads it the same way) of: 2-byte big-endian length of the wrapped key, the AES-256 key wrapped with the
            device's RSA public key (OAEP with SHA-1, the padding the Android Keystore supports on every
            version), a 12-byte nonce, then AES-GCM ciphertext with its 16-byte tag. The plaintext is UTF-8
            JSON: {"businessId", "generatedAt", "staff": [{"staffId", "username", "displayName", "role",
            "pinHash", "pinChangedAt"}]}; pinHash is ASP.NET Core Identity's v3 format (PBKDF2).
    PosOfflineSession:
      type: object
      additionalProperties: false
      required: [staffId, signedInAt]
      properties:
        staffId:
          type: string
          format: uuid
        signedInAt:
          type: string
          format: date-time
          description: When the person signed in offline; within the last 12 hours.
        pinChangedAt:
          type: string
          format: date-time
          nullable: true
          description: The pinChangedAt of the bundle entry the PIN was checked against.
    PosAttempt:
      type: object
      additionalProperties: false
      required: [username, success, at]
      properties:
        username:
          type: string
        success:
          type: boolean
        at:
          type: string
          format: date-time
    PosAttemptReport:
      type: object
      additionalProperties: false
      required: [attempts]
      properties:
        attempts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PosAttempt'
  parameters:
    ClientHeader:
      name: X-HelloPos-Client
      in: header
      required: true
      description: Must be "web". Guards cookie-authenticated requests against cross-site forgery.
      schema:
        type: string
        enum: [web]
    BusinessHeader:
      name: X-HelloPos-Business
      in: header
      required: false
      description: >
        The business this page was opened for. When it differs from the session's open business
        (another tab switched), the request is refused with 409 instead of acting for the wrong
        business. It never selects the business.
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationProblem:
      description: The request is invalid; errors are listed per field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    InvalidLink:
      description: The link is invalid, already used or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MissingClientHeader:
      description: The X-HelloPos-Client header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotSignedIn:
      description: No session, or the session has ended.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Too many attempts from this address; wait a minute.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BusinessChanged:
      description: >
        Another business is open in this session now (type urn:hellopos:problem:business-changed);
        reload the page.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RoleNotAllowed:
      description: The caller's role in this business does not allow this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found (also for another business's records).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    StaffConflict:
      description: >
        Someone else changed this person (staff-changed), the change would leave no active owner
        (last-owner), or another business is open in this session now (business-changed).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DeviceConflict:
      description: Someone else changed this device (device-changed), or another business is open now.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: hellopos_session
      description: HttpOnly session cookie set by ownerSignIn (web back office only).
    deviceCredential:
      type: apiKey
      in: header
