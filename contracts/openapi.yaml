                  $ref: '#/components/schemas/ItemDiscount'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CatalogConflict'
    post:
      tags: [Catalog]
      operationId: createItemDiscount
