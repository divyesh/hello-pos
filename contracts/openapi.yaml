        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDiscount'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CatalogConflict'
  /catalog/products/{productId}/discounts/{discountId}:
    put:
      tags: [Catalog]
      operationId: updateItemDiscount
      summary: Change a future discount, or end a running one early
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/DiscountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemDiscountInput'
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDiscount'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CatalogConflict'
    delete:
      tags: [Catalog]
      operationId: deleteItemDiscount
      summary: Remove a future discount
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/DiscountId'
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CatalogConflict'
  /catalog/imports/preview:
    post:
      tags: [Catalog]
      operationId: previewCatalogImport
      summary: Check a CSV file; saves nothing
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200':
          description: Every row with its outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/CatalogConflict'
  /catalog/imports:
    get:
      tags: [Catalog]
      operationId: listCatalogImports
      summary: Past imports, newest first
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
      responses:
        '200':
          description: The imports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogImport'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/CatalogConflict'
    post:
      tags: [Catalog]
      operationId: importCatalog
      summary: Import a CSV file (all or nothing)
      description: >
        The file is checked again; any row error refuses the whole import (400 with the preview).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - $ref: '#/components/parameters/BusinessHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200':
          description: Imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImport'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/CatalogConflict'
  /catalog/changes:
    get:
      tags: [Catalog]
      operationId: listCatalogChanges
      summary: Catalog history, newest first
      parameters:
        - $ref: '#/components/parameters/BusinessHeader'
        - name: entityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
      responses:
        '200':
          description: One page of changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogChange'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/NotSignedIn'
        '403':
          $ref: '#/components/responses/RoleNotAllowed'
        '409':
          $ref: '#/components/responses/CatalogConflict'
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [service, version, status, serverTimeUtc]
      properties:
        service:
          type: string
          description: Service name.
          example: hello-pos-api
        version:
          type: string
          description: Build version of the running service.
          example: 0.1.0-dev
        status:
          type: string
          enum: [available, degraded]
        serverTimeUtc:
          type: string
          format: date-time
          description: Current server time in UTC (ISO 8601, ending in Z).
    ProblemDetails:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          description: Correlation id for this request (Constitution, Principle IX).
    ValidationProblemDetails:
      type: object
      description: RFC 7807 problem details with the message for each invalid field.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: object
          description: Field name (camelCase) to messages.
          additionalProperties:
            type: array
            items:
              type: string
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          description: The owner's name, 1 to 100 characters.
          example: Asha Patel
        email:
          type: string
          example: asha@example.com
        password:
          type: string
          description: At least 12 and at most 128 characters; very common passwords are refused.
    OwnerTokenRequest:
      type: object
      additionalProperties: false
      required: [ownerId, token]
      properties:
        ownerId:
          type: string
          format: uuid
        token:
          type: string
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [ownerId, token, newPassword]
      properties:
        ownerId:
          type: string
          format: uuid
        token:
          type: string
        newPassword:
          type: string
    OwnerProfile:
      type: object
      additionalProperties: false
      required: [ownerId, displayName, email, emailVerified]
      properties:
        ownerId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        currentBusinessId:
          type: string
          format: uuid
          description: The business opened in this session; absent when none is open.
        currentRole:
          type: string
          enum: [owner, manager]
          description: >
            The account's role in the open business; absent when none is open or the account is no
            longer active staff there.
    BusinessSettings:
      type: object
      additionalProperties: false
      required: [name, countryCode, currencyCode, pricingMode, financialYearStartMonth, timeZone, cashRoundingStepMinor]
      properties:
        name:
          type: string
          description: 1 to 200 characters.
          example: Patel Grocers
        countryCode:
          type: string
          enum: [IN, US, CA]
        currencyCode:
          type: string
          description: ISO 4217, three capital letters.
          example: INR
        pricingMode:
          type: string
          enum: [tax_inclusive, tax_exclusive]
        financialYearStartMonth:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        timeZone:
          type: string
          description: IANA time zone in the chosen country.
          example: Asia/Kolkata
        cashRoundingStepMinor:
          type: integer
          format: int64
          description: Cash rounding step in minor units (paise, cents); 0 (none), 5, 10 or 100.
          enum: [0, 5, 10, 100]
        depositsTaxable:
          type: boolean
          description: Container deposits are taxed with the product (owners); default false.
    Business:
      type: object
      additionalProperties: false
      required: [id, name, countryCode, currencyCode, pricingMode, financialYearStartMonth, timeZone, cashRoundingStepMinor, depositsTaxable, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        countryCode:
          type: string
          enum: [IN, US, CA]
        currencyCode:
          type: string
        pricingMode:
          type: string
          enum: [tax_inclusive, tax_exclusive]
        financialYearStartMonth:
          type: integer
          format: int32
        timeZone:
          type: string
        cashRoundingStepMinor:
          type: integer
          format: int64
        depositsTaxable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BusinessSummary:
      type: object
      additionalProperties: false
      required: [id, name, countryCode, currencyCode, role]
      properties:
        role:
          type: string
          enum: [owner, manager]
          description: The signed-in account's role in this business.
        id:
          type: string
          format: uuid
        name:
          type: string
        countryCode:
          type: string
          enum: [IN, US, CA]
        currencyCode:
          type: string
    StaffMember:
      type: object
      additionalProperties: false
      required: [id, displayName, role, active, hasPin, hasBackOfficeAccess, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier]
        active:
          type: boolean
        posUsername:
          type: string
          description: POS sign-in name; absent when the person does not use the POS.
        hasPin:
          type: boolean
        hasBackOfficeAccess:
          type: boolean
          description: Linked to a back-office account (owners and invited managers).
        version:
          type: integer
          format: int32
          description: Send back when changing this person; a stale value is refused (staff-changed).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NewStaffMember:
      type: object
      additionalProperties: false
      required: [displayName, role, posUsername, pin]
      properties:
        displayName:
          type: string
          description: 1 to 100 characters.
        role:
          type: string
          enum: [manager, cashier]
        posUsername:
          type: string
          description: 3 to 32 letters, digits, dots, dashes or underscores; unique in the business.
        pin:
          type: string
          description: 4 to 6 digits, not one repeated digit and not a run like 1234.
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, displayName, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [owner, manager]
        displayName:
          type: string
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NewInvitation:
      type: object
      additionalProperties: false
      required: [email, role, displayName]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [owner, manager]
        displayName:
          type: string
    InvitationToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [businessName, role, displayName]
      properties:
        businessName:
          type: string
        role:
          type: string
          enum: [owner, manager]
        displayName:
          type: string
    StaffUpdate:
      type: object
      additionalProperties: false
      required: [displayName, role, version]
      properties:
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier]
        version:
          type: integer
          format: int32
    StaffVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int32
    StaffPin:
      type: object
      additionalProperties: false
      required: [posUsername, pin, version]
      properties:
        posUsername:
          type: string
        pin:
          type: string
        version:
          type: integer
          format: int32
    Device:
      type: object
      additionalProperties: false
      required: [id, name, registeredBy, registeredAt, active, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        registeredBy:
          type: string
          description: Name of the person who registered it.
        registeredAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        active:
          type: boolean
        version:
          type: integer
          format: int32
    DevicePairing:
      type: object
      additionalProperties: false
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: ABCD-EFGH (no 0, O, 1, I or L).
        expiresAt:
          type: string
          format: date-time
    DeviceRename:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int32
    DeviceVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int32
    PosDeviceInfo:
      type: object
      additionalProperties: false
      required: [deviceId, deviceName, businessId, businessName]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
    PosPairRequest:
      type: object
      additionalProperties: false
      required: [code, deviceName, publicKey]
      properties:
        code:
          type: string
        deviceName:
          type: string
          description: 1 to 60 characters, for example Front till.
        publicKey:
          type: string
          description: The device's RSA public key (X.509 SubjectPublicKeyInfo, base64), at least 2048 bits.
    PosPairResult:
      type: object
      additionalProperties: false
      required: [deviceId, deviceCredential, businessId, businessName]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceCredential:
          type: string
          description: 'Sent as "Authorization: Device <credential>". Shown only in this response.'
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
    PosSignInRequest:
      type: object
      additionalProperties: false
      required: [username, pin]
      properties:
        username:
          type: string
        pin:
          type: string
    PosRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    PosTokens:
      type: object
      additionalProperties: false
      required: [accessToken, accessExpiresAt, refreshToken, sessionExpiresAt]
      properties:
        accessToken:
          type: string
          description: 'Sent as "Authorization: Bearer <token>"; valid 15 minutes.'
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Replaced on every refresh; keep only the newest.
        sessionExpiresAt:
          type: string
          format: date-time
          description: The session ends at this time at the latest (12 hours after sign-in).
    PosStaff:
      type: object
      additionalProperties: false
      required: [staffId, displayName, role, businessId, businessName]
      properties:
        staffId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [owner, manager, cashier]
        businessId:
          type: string
          format: uuid
        businessName:
          type: string
    PosSignInResult:
      type: object
      additionalProperties: false
      required: [tokens, staff]
      properties:
        tokens:
          $ref: '#/components/schemas/PosTokens'
        staff:
          $ref: '#/components/schemas/PosStaff'
    PosChangePin:
      type: object
      additionalProperties: false
      required: [currentPin, newPin]
      properties:
        currentPin:
          type: string
        newPin:
          type: string
          description: 4 to 6 digits, not a simple pattern.
    PosOfflineAccess:
      type: object
      additionalProperties: false
      required: [version, generatedAt, bundle]
      properties:
        version:
          type: string
          description: Changes whenever the contents change.
        generatedAt:
          type: string
          format: date-time
        bundle:
          type: string
          description: >
            Base64 (plain string, so every client reads it the same way) of: 2-byte big-endian length of the wrapped key, the AES-256 key wrapped with the
            device's RSA public key (OAEP with SHA-1, the padding the Android Keystore supports on every
            version), a 12-byte nonce, then AES-GCM ciphertext with its 16-byte tag. The plaintext is UTF-8
            JSON: {"businessId", "generatedAt", "staff": [{"staffId", "username", "displayName", "role",
            "pinHash", "pinChangedAt"}]}; pinHash is ASP.NET Core Identity's v3 format (PBKDF2).
    PosOfflineSession:
      type: object
      additionalProperties: false
      required: [staffId, signedInAt]
      properties:
        staffId:
          type: string
          format: uuid
        signedInAt:
          type: string
          format: date-time
          description: When the person signed in offline; within the last 12 hours.
        pinChangedAt:
          type: string
          format: date-time
          nullable: true
          description: The pinChangedAt of the bundle entry the PIN was checked against.
    PosAttempt:
      type: object
      additionalProperties: false
      required: [username, success, at]
      properties:
        username:
          type: string
        success:
          type: boolean
        at:
          type: string
          format: date-time
    PosAttemptReport:
      type: object
      additionalProperties: false
      required: [attempts]
      properties:
        attempts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PosAttempt'
    TaxComponent:
      type: object
      additionalProperties: false
      required: [label, ratePercent]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
        ratePercent:
          type: string
          description: Percent as an invariant decimal string, 0 to 100, at most 3 decimals.
          pattern: '^[0-9]{1,3}(\.[0-9]{1,3})?$'
          example: '2.5'
    TaxProfileVersion:
      type: object
      additionalProperties: false
      required: [id, effectiveFrom, components, current, editable]
      properties:
        id:
          type: string
          format: uuid
        effectiveFrom:
          type: string
          format: date
          description: First day it applies, in the business time zone.
        components:
          type: array
          items:
            $ref: '#/components/schemas/TaxComponent'
        current:
          type: boolean
          description: The version in force now.
        editable:
          type: boolean
          description: True only for versions not yet in force.
    TaxProfile:
      type: object
      additionalProperties: false
      required: [id, name, kind, active, version, versions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [taxable, zeroRated, exempt]
        active:
          type: boolean
        version:
          type: integer
          format: int32
        versions:
          type: array
          description: Oldest first; past versions older than the current one are omitted.
          items:
            $ref: '#/components/schemas/TaxProfileVersion'
    NewTaxProfile:
      type: object
      additionalProperties: false
      required: [name, kind, components]
      properties:
        name:
          type: string
          maxLength: 60
        kind:
          type: string
          enum: [taxable, zeroRated, exempt]
        effectiveFrom:
          type: string
          format: date
          description: Defaults to today (business time zone).
        components:
          type: array
          description: At least one for taxable profiles; none for zero-rated and exempt.
          items:
            $ref: '#/components/schemas/TaxComponent'
    TaxProfileRename:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          maxLength: 60
        version:
          type: integer
          format: int32
    TaxProfileVersionInput:
      type: object
      additionalProperties: false
      required: [effectiveFrom, components, version]
      properties:
        effectiveFrom:
          type: string
          format: date
        components:
          type: array
          items:
            $ref: '#/components/schemas/TaxComponent'
        version:
          type: integer
          format: int32
          description: The profile's version.
    CatalogVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int32
    Category:
      type: object
      additionalProperties: false
      required: [id, name, sortOrder, defaultTaxProfileId, active, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        defaultTaxProfileId:
          type: string
          format: uuid
        active:
          type: boolean
        version:
          type: integer
          format: int32
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name, sortOrder, defaultTaxProfileId]
      properties:
        name:
          type: string
          maxLength: 60
        sortOrder:
          type: integer
          format: int32
        defaultTaxProfileId:
          type: string
          format: uuid
    CategoryUpdate:
      type: object
      additionalProperties: false
      required: [name, sortOrder, defaultTaxProfileId, version]
      properties:
        name:
          type: string
          maxLength: 60
        sortOrder:
          type: integer
          format: int32
        defaultTaxProfileId:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, categoryId, unit, openPrice, minQuantity, step, depositPerUnit, barcodes]
      properties:
        name:
          type: string
          maxLength: 120
        sku:
          type: string
          maxLength: 40
        categoryId:
          type: string
          format: uuid
        taxProfileId:
          type: string
          format: uuid
          description: Overrides the category's default tax profile; omit to follow it.
        unit:
          type: string
          enum: [piece, g, kg, ml, l]
        unitPrice:
          type: integer
          format: int64
          description: Minor units of the business currency; required unless openPrice.
        openPrice:
          type: boolean
        minQuantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'
        step:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'
        minAge:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        depositPerUnit:
          type: integer
          format: int64
          minimum: 0
        barcodes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 20
    ProductUpdate:
      type: object
      additionalProperties: false
      required: [name, categoryId, unit, openPrice, minQuantity, step, depositPerUnit, barcodes, version]
      properties:
        name:
          type: string
          maxLength: 120
        sku:
          type: string
          maxLength: 40
        categoryId:
          type: string
          format: uuid
        taxProfileId:
          type: string
          format: uuid
        unit:
          type: string
          enum: [piece, g, kg, ml, l]
        unitPrice:
          type: integer
          format: int64
        openPrice:
          type: boolean
        minQuantity:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'
        step:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'
        minAge:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        depositPerUnit:
          type: integer
          format: int64
          minimum: 0
        barcodes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 20
        version:
          type: integer
          format: int32
    Barcode:
      type: object
      additionalProperties: false
      required: [code, kind]
      properties:
        code:
          type: string
          description: Normalized (UPC-A shown in its 13-digit form).
        kind:
          type: string
          enum: [ean13, ean8, plu]
    Product:
      type: object
      additionalProperties: false
      required: [id, name, categoryId, effectiveTaxProfileId, unit, openPrice, minQuantity, step, depositPerUnit, barcodes, currency, active, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
        categoryId:
          type: string
          format: uuid
        taxProfileId:
          type: string
          format: uuid
          description: Present only when the product overrides its category's tax profile.
        effectiveTaxProfileId:
          type: string
          format: uuid
        unit:
          type: string
          enum: [piece, g, kg, ml, l]
        unitPrice:
          type: integer
          format: int64
          description: Absent for open-price products.
        openPrice:
          type: boolean
        minQuantity:
          type: string
        step:
          type: string
        minAge:
          type: integer
          format: int32
        depositPerUnit:
          type: integer
          format: int64
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/Barcode'
        currency:
          type: string
          description: ISO 4217 code of the amounts.
        active:
          type: boolean
        version:
          type: integer
          format: int32
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    ItemDiscountInput:
      type: object
      additionalProperties: false
      required: [kind, value, fromDate]
      properties:
        kind:
          type: string
          enum: [percent, fixed]
        value:
          type: string
          description: Percent (0 to 100, at most 3 decimals) or a fixed amount per unit in minor units, as a decimal string.
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
          description: Inclusive; omit for open-ended.
    ItemDiscount:
      type: object
      additionalProperties: false
      required: [id, kind, value, fromDate, status]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [percent, fixed]
        value:
          type: string
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        status:
          type: string
          enum: [future, running, ended]
    ImportRow:
      type: object
      additionalProperties: false
      required: [row, outcome, errors]
      properties:
        row:
          type: integer
          format: int32
          description: Line number in the file (the header is line 1).
        outcome:
          type: string
          enum: [create, update, unchanged, error]
        sku:
          type: string
        name:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [column, message]
            properties:
              column:
                type: string
              message:
                type: string
    ImportPreview:
      type: object
      additionalProperties: false
      required: [rows, create, update, unchanged, errors]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRow'
        create:
          type: integer
          format: int32
        update:
          type: integer
          format: int32
        unchanged:
          type: integer
          format: int32
        errors:
          type: integer
          format: int32
    CatalogImport:
      type: object
      additionalProperties: false
      required: [id, at, fileName, rows, created, updated, unchanged]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        fileName:
          type: string
        rows:
          type: integer
          format: int32
        created:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
        unchanged:
          type: integer
          format: int32
    CatalogChange:
      type: object
      additionalProperties: false
      required: [at, actor, entity, entityId, action, changes]
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Display name of the person who made the change.
        entity:
          type: string
          enum: [taxProfile, taxProfileVersion, category, product, itemDiscount, business]
        entityId:
          type: string
          format: uuid
        action:
          type: string
          enum: [created, updated, deactivated, reactivated, deleted, imported]
        changes:
          type: array
          description: Each changed field with its old and new value as text (absent when there was none).
          items:
            type: object
            additionalProperties: false
            required: [field]
            properties:
              field:
                type: string
              old:
                type: string
              new:
                type: string
    CatalogSync:
      type: object
      additionalProperties: false
      required: [mode, revision, serverTime, business, taxProfiles, categories, products, discounts, removedDiscountIds]
      properties:
        mode:
          type: string
          enum: [full, changes]
          description: full replaces the device's copy; changes applies on top of `since`.
        revision:
          type: integer
          format: int64
          description: The copy's revision once applied; send it as `since` next time.
        serverTime:
          type: string
          format: date-time
        business:
          $ref: '#/components/schemas/CatalogSettings'
        taxProfiles:
          type: array
          items:
            $ref: '#/components/schemas/SyncTaxProfile'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SyncCategory'
        products:
          type: array
          items:
            $ref: '#/components/schemas/SyncProduct'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/SyncDiscount'
        removedDiscountIds:
          type: array
          description: Discounts removed after `since`; empty in full mode.
          items:
            type: string
            format: uuid
    CatalogSettings:
      type: object
      additionalProperties: false
      required: [currency, pricingMode, timeZone, cashRoundingStep, depositsTaxable]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        pricingMode:
          type: string
          enum: [tax_inclusive, tax_exclusive]
        timeZone:
          type: string
          description: IANA time zone; dates of tax versions and discounts are in it.
        cashRoundingStep:
          type: integer
          format: int64
          description: Minor units.
        depositsTaxable:
          type: boolean
    SyncTaxProfile:
      type: object
      additionalProperties: false
      required: [id, name, kind, active, versions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [taxable, zeroRated, exempt]
        active:
          type: boolean
        versions:
          type: array
          description: Every version, past and future.
          items:
            $ref: '#/components/schemas/SyncTaxProfileVersion'
    SyncTaxProfileVersion:
      type: object
      additionalProperties: false
      required: [id, effectiveFrom, components]
      properties:
        id:
          type: string
          format: uuid
        effectiveFrom:
          type: string
          format: date
        components:
          type: array
          items:
            $ref: '#/components/schemas/TaxComponent'
    SyncCategory:
      type: object
      additionalProperties: false
      required: [id, name, sortOrder, defaultTaxProfileId, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        defaultTaxProfileId:
          type: string
          format: uuid
        active:
          type: boolean
    SyncProduct:
      type: object
      additionalProperties: false
      required: [id, name, categoryId, unit, openPrice, minQuantity, step, depositPerUnit, active, barcodes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
        categoryId:
          type: string
          format: uuid
        taxProfileId:
          type: string
          format: uuid
          description: Present only when the product overrides its category's tax profile.
        unit:
          type: string
          enum: [piece, g, kg, ml, l]
        unitPrice:
          type: integer
          format: int64
          description: Minor units; absent for open-price products.
        openPrice:
          type: boolean
        minQuantity:
          type: string
        step:
          type: string
        minAge:
          type: integer
          format: int32
        depositPerUnit:
          type: integer
          format: int64
        active:
          type: boolean
        barcodes:
          type: array
          description: Normalized codes (UPC-A in its 13-digit EAN form).
          items:
            type: string
    SyncDiscount:
      type: object
      additionalProperties: false
      required: [id, productId, kind, fromDate]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [percent, fixed]
        percent:
          type: string
          description: When kind is percent; invariant decimal string.
        amountOff:
          type: integer
          format: int64
          description: When kind is fixed; minor units off each unit.
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
          description: Inclusive; absent when open-ended.
  parameters:
    ClientHeader:
      name: X-HelloPos-Client
      in: header
      required: true
      description: Must be "web". Guards cookie-authenticated requests against cross-site forgery.
      schema:
        type: string
        enum: [web]
    BusinessHeader:
      name: X-HelloPos-Business
      in: header
      required: false
      description: >
        The business this page was opened for. When it differs from the session's open business
        (another tab switched), the request is refused with 409 instead of acting for the wrong
        business. It never selects the business.
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaxProfileId:
      name: taxProfileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaxProfileVersionId:
      name: taxProfileVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiscountId:
      name: discountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActiveFilter:
      name: active
      in: query
      required: false
      description: Omit for all; true for active only; false for inactive only.
      schema:
        type: boolean
  responses:
    ValidationProblem:
      description: The request is invalid; errors are listed per field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    InvalidLink:
      description: The link is invalid, already used or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MissingClientHeader:
      description: The X-HelloPos-Client header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotSignedIn:
      description: No session, or the session has ended.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Too many attempts from this address; wait a minute.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BusinessChanged:
      description: >
        Another business is open in this session now (type urn:hellopos:problem:business-changed);
        reload the page.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RoleNotAllowed:
      description: The caller's role in this business does not allow this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found (also for another business's records).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    StaffConflict:
      description: >
        Someone else changed this person (staff-changed), the change would leave no active owner
        (last-owner), or another business is open in this session now (business-changed).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DeviceConflict:
      description: Someone else changed this device (device-changed), or another business is open now.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    CatalogConflict:
      description: >
        Someone else changed this record (catalog-changed), it is in use or not editable any more, or
        another business is open in this session now (business-changed).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: hellopos_session
      description: HttpOnly session cookie set by ownerSignIn (web back office only).
    deviceCredential:
      type: apiKey
      in: header
      name: Authorization
      description: 'A registered POS device: "Device dev_<business>.<device>.<secret>".'
    staffSession:
      type: http
      scheme: bearer
      description: 'A person signed in on a POS device: "Bearer pat_<business>.<session>.<secret>".'
